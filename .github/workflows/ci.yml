name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Claude Code CLI and shellcheck
        run: |
          npm install --global @anthropic-ai/claude-code
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck jq
      - name: Validate the plugin and marketplace manifests
        run: |
          claude plugin validate . --strict
          claude plugin validate .claude-plugin/plugin.json --strict
      - name: Lint the shell scripts
        run: shellcheck -s sh scripts/* test/*.sh
      - name: Manifest versions agree
        run: scripts/check-versions.sh
      - name: The SessionStart hook says logged in or setup first
        run: test/session-start.sh
      - name: Launcher installs the pinned CLI
        run: test/launcher.sh
      - name: The shade script behaves offline against fake curl and rclone
        run: test/shade.sh
